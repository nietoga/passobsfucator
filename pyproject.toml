[project]
name = "passobfuscator"
version = "0.1.0"
description = "A time-lock encryption tool for obfuscating passwords"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.5",
    "tqdm>=4.66.2",
    "typer>=0.12.0",
]

[project.scripts]
passobfuscator = "main:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
